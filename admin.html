<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AJ TIPS | Admin Panel</title>

<style>

*{

  box-sizing:border-box;

  margin:0;

  padding:0;

}

body{

  font-family:Arial,Helvetica,sans-serif;

  background:#050708;

  color:white;

  min-height:100vh;

  padding:25px 5%;

}

.container{

  max-width:700px;

  margin:auto;

}

.logo{

  text-align:center;

  font-size:32px;

  font-weight:900;

  margin-bottom:8px;

}

.logo span{

  color:#20e879;

}

.subtitle{

  text-align:center;

  color:#7f8983;

  margin-bottom:35px;

}

.panel{

  background:#0d1310;

  border:1px solid #202c25;

  border-radius:18px;

  padding:25px;

  margin-bottom:20px;

}

h2{

  margin-bottom:20px;

}

label{

  display:block;

  color:#9ca7a1;

  font-size:13px;

  font-weight:bold;

  margin-bottom:7px;

}

input,

select{

  width:100%;

  padding:14px;

  margin-bottom:18px;

  background:#080c0a;

  border:1px solid #29362e;

  border-radius:9px;

  color:white;

  font-size:15px;

  outline:none;

}

input:focus,

select:focus{

  border-color:#20e879;

}

.match-box{

  border:1px solid #26342c;

  border-radius:12px;

  padding:18px;

  margin-bottom:15px;

}

.match-title{

  color:#20e879;

  font-weight:bold;

  margin-bottom:15px;

}

button{

  width:100%;

  border:0;

  padding:15px;

  border-radius:10px;

  font-size:16px;

  font-weight:900;

  cursor:pointer;

}

.save{

  background:#20e879;

  color:#031008;

}

.clear{

  margin-top:10px;

  background:#151b17;

  color:#ff6666;

  border:1px solid #333;

}

.message{

  text-align:center;

  margin-top:15px;

  color:#20e879;

  font-weight:bold;

}

.back{

  display:block;

  text-align:center;

  color:#20e879;

  text-decoration:none;

  margin-top:25px;

}

</style>

</head>

<body>

<div class="container">

  <div class="logo">

    AJ<span>TIPS</span>

  </div>

  <p class="subtitle">

    Admin Panel — Daily Football Tips

  </p>

  <div class="panel">

    <h2>⚽ Today's Matches</h2>

    <!-- MATCH 1 -->

    <div class="match-box">

      <div class="match-title">

        MATCH 01

      </div>

      <label>Teams</label>

      <input

        id="match1"

        type="text"

        placeholder="Barcelona - Real Madrid">

      <label>Prediction</label>

      <input

        id="tip1"

        type="text"

        placeholder="OVER 2.5">

      <label>Odd</label>

      <input

        id="odd1"

        type="text"

        placeholder="1.85">

    </div>

    <!-- MATCH 2 -->

    <div class="match-box">

      <div class="match-title">

        MATCH 02

      </div>

      <label>Teams</label>

      <input

        id="match2"

        type="text"

        placeholder="Inter - Milan">

      <label>Prediction</label>

      <input

        id="tip2"

        type="text"

        placeholder="BTTS">

      <label>Odd</label>

      <input

        id="odd2"

        type="text"

        placeholder="1.70">

    </div>

    <!-- MATCH 3 -->

    <div class="match-box">

      <div class="match-title">

        MATCH 03

      </div>

      <label>Teams</label>

      <input

        id="match3"

        type="text"

        placeholder="Arsenal - Chelsea">

      <label>Prediction</label>

      <input

        id="tip3"

        type="text"

        placeholder="1X">

      <label>Odd</label>

      <input

        id="odd3"

        type="text"

        placeholder="1.55">

    </div>

    <!-- MATCH 4 -->

    <div class="match-box">

      <div class="match-title">

        MATCH 04

      </div>

      <label>Teams</label>

      <input

        id="match4"

        type="text"

        placeholder="Bayern - Dortmund">

      <label>Prediction</label>

      <input

        id="tip4"

        type="text"

        placeholder="OVER 1.5">

      <label>Odd</label>

      <input

        id="odd4"

        type="text"

        placeholder="1.40">

    </div>

    <!-- MATCH 5 -->

    <div class="match-box">

      <div class="match-title">

        MATCH 05

      </div>

      <label>Teams</label>

      <input

        id="match5"

        type="text"

        placeholder="Liverpool - Manchester City">

      <label>Prediction</label>

      <input

        id="tip5"

        type="text"

        placeholder="BTTS">

      <label>Odd</label>

      <input

        id="odd5"

        type="text"

        placeholder="1.80">

    </div>

    <button

      class="save"

      onclick="saveTips()">

      💾 SAVE TODAY'S TIPS

    </button>

    <button

      class="clear"

      onclick="clearTips()">

      Clear

    </button>

    <div

      id="message"

      class="message">

    </div>

  </div>

  <a

    href="index.html"

    class="back">

    ← Back to AJ TIPS

  </a>

</div>

<script>

function saveTips(){

  const tips = [];

  for(let i = 1; i <= 5; i++){

    tips.push({

      match:

        document.getElementById("match" + i).value,

      tip:

        document.getElementById("tip" + i).value,

      odd:

        document.getElementById("odd" + i).value

    });

  }

  localStorage.setItem(

    "ajTips",

    JSON.stringify(tips)

  );

  document.getElementById("message").textContent =

    "✅ Tips saved successfully!";

}

function loadTips(){

  const saved =

    localStorage.getItem("ajTips");

  if(!saved) return;

  const tips =

    JSON.parse(saved);

  tips.forEach((item,index)=>{

    const number = index + 1;

    document.getElementById(

      "match" + number

    ).value = item.match || "";

    document.getElementById(

      "tip" + number

    ).value = item.tip || "";

    document.getElementById(

      "odd" + number

    ).value = item.odd || "";

  });

}

function clearTips(){

  localStorage.removeItem("ajTips");

  for(let i = 1; i <= 5; i++){

    document.getElementById(

      "match" + i

    ).value = "";

    document.getElementById(

      "tip" + i

    ).value = "";

    document.getElementById(

      "odd" + i

    ).value = "";

  }

  document.getElementById("message").textContent =

    "Tips cleared.";

}

loadTips();

</script>

</body>

</html>
